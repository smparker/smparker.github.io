<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>xap</title>
  <defs>
    <!-- Atom shading: light from upper-left, like xap's Phong renderer -->
    <radialGradient id="carbon" cx="0.35" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#b9bcc8"/>
      <stop offset="0.45" stop-color="#5d6070"/>
      <stop offset="1" stop-color="#23242e"/>
    </radialGradient>
    <radialGradient id="oxygen" cx="0.35" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffb3a8"/>
      <stop offset="0.45" stop-color="#dc2828"/>
      <stop offset="1" stop-color="#6e0f12"/>
    </radialGradient>
    <radialGradient id="nitrogen" cx="0.35" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#b8c4ff"/>
      <stop offset="0.45" stop-color="#3050f8"/>
      <stop offset="1" stop-color="#14206e"/>
    </radialGradient>
    <radialGradient id="hydrogen" cx="0.35" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#e6e6e6"/>
      <stop offset="1" stop-color="#8d8f9a"/>
    </radialGradient>
    <linearGradient id="bond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4d6de"/>
      <stop offset="0.5" stop-color="#8a8c98"/>
      <stop offset="1" stop-color="#3f414d"/>
    </linearGradient>
    <radialGradient id="lobePos" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6464ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6464ff" stop-opacity="0.12"/>
    </radialGradient>
    <radialGradient id="lobeNeg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6464" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff6464" stop-opacity="0.12"/>
    </radialGradient>
  </defs>

  <!-- Background: xap's default background colour (25,25,38) -->
  <rect width="512" height="512" rx="104" fill="#191926"/>

  <!-- p-orbital style lobes along the vertical axis (isosurface colours) -->
  <g>
    <ellipse cx="256" cy="150" rx="78" ry="104" fill="url(#lobePos)" stroke="#6464ff" stroke-opacity="0.7" stroke-width="3"/>
    <ellipse cx="256" cy="362" rx="78" ry="104" fill="url(#lobeNeg)" stroke="#ff6464" stroke-opacity="0.7" stroke-width="3"/>
  </g>

  <!-- Bonds forming an X -->
  <g transform="rotate(45 256 256)">
    <rect x="90" y="241" width="332" height="30" rx="15" fill="url(#bond)"/>
  </g>
  <g transform="rotate(-45 256 256)">
    <rect x="90" y="241" width="332" height="30" rx="15" fill="url(#bond)"/>
  </g>

  <!-- Atoms -->
  <circle cx="139" cy="139" r="46" fill="url(#oxygen)"/>
  <circle cx="373" cy="139" r="40" fill="url(#hydrogen)"/>
  <circle cx="139" cy="373" r="40" fill="url(#hydrogen)"/>
  <circle cx="373" cy="373" r="46" fill="url(#nitrogen)"/>
  <circle cx="256" cy="256" r="58" fill="url(#carbon)"/>
</svg>
